name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Los runners de GitHub ya incluyen el Android SDK (ANDROID_HOME), no hace falta instalarlo.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: calorias-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en la release apk-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk calorias.apk
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Calorías - última versión" \
              --notes "APK de depuración generado automáticamente por GitHub Actions." --latest=false
          gh release upload apk-latest calorias.apk --clobber
