name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Los runners de GitHub ya incluyen el Android SDK (ANDROID_HOME), no hace falta instalarlo.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Comprobar clave de Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning title=Falta MAPS_API_KEY::El secreto MAPS_API_KEY no llega a la compilación; el mapa de las rutas saldrá en blanco. Créalo en Settings → Secrets and variables → Actions."
          else
            echo "Clave de Maps presente (longitud ${#MAPS_API_KEY})."
          fi

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: calorias-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en la release apk-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk calorias.apk
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Calorías - última versión" \
              --notes "APK de depuración generado automáticamente por GitHub Actions." --latest=false
          gh release upload apk-latest calorias.apk --clobber
          # La app compara este identificador con el de su propia compilación para saber si hay una versión nueva.
          gh release edit apk-latest --notes "BUILD_ID=${GITHUB_RUN_ID}"
